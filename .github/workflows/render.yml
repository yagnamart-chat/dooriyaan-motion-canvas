name: Render Video

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Render
        run: npm run render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/**/*.mp4
          retention-days: 7
